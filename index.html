<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عيادة أسنان د/ حسام عبدالحكيم عوض الشاهين</title>
<link rel="icon" type="image/png" href="assets/icon-navy-64.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app-shell">
    <aside id="sidebar">
      <div id="sidebar-header">
        <img src="assets/icon-white-96.png" alt="شعار العيادة" id="sidebar-logo">
        <div id="clinic-name-title">عيادة أسنان د/ حسام عبدالحكيم عوض الشاهين</div>
      </div>
      <nav id="sidebar-nav"></nav>
      <div id="sidebar-quick">
        <button id="qa-patient">+ إضافة مريض</button>
        <button id="qa-appointment">+ حجز موعد</button>
        <button id="qa-visit">+ تسجيل زيارة</button>
      </div>
    </aside>
    <div id="main-wrap">
      <header id="topbar">
        <button id="sidebar-toggle-btn" aria-label="القائمة">☰</button>
        <div class="global-search-wrap">
          <input type="text" id="global-search" class="input" placeholder="بحث بالاسم / رقم الملف / رقم الهاتف...">
          <div id="global-search-results"></div>
        </div>
        <span id="sync-indicator" class="sync-indicator" style="display:none"></span>
      </header>
      <main id="main-content"></main>
    </div>
  </div>
  <div id="sidebar-overlay"></div>
  <div id="toast-container"></div>

  <script src="libs/xlsx.full.min.js"></script>
  <script src="libs/pdf.min.js"></script>
  <script src="libs/pdf-lib.min.js"></script>
  <script src="libs/supabase.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/db.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/patients.js"></script>
  <script src="js/appointments.js"></script>
  <script src="js/visits.js"></script>
  <script src="js/rxtemplate.js"></script>
  <script src="js/prescriptions.js"></script>
  <script src="js/treatmentplans.js"></script>
  <script src="js/payments.js"></script>
  <script src="js/expenses.js"></script>
  <script src="js/reports.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/backup.js"></script>
  <script src="js/import.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
